name: Resource Lifecycle CI

on:
  push:
    branches:
      - feature/resource-lifecycle-policy
  pull_request:
    branches:
      - main

jobs:
  backend-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Run backend verification suite
        working-directory: backend
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          CSRF_SECRET: ci-csrf-secret-at-least-32-characters-long
          NODE_ENV: test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
